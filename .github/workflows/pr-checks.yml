name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-node:
    name: Windows / Node ${{ matrix.node-version }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Use hoisted node-linker
        shell: pwsh
        run: Copy-Item .npmrc.ci .npmrc -Force

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Deterministic default gates
        run: pnpm test
        env:
          # GitHub-hosted Windows runs as a non-interactive service session.
          # Native PTY behavior remains mandatory on interactive Windows.
          NLC_SKIP_NATIVE_PTY: "1"

      - name: Storage ABI and integration gates
        run: pnpm test:integration

  windows-package:
    name: Windows package and installed CLI
    needs: windows-node
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Use hoisted node-linker
        shell: pwsh
        run: Copy-Item .npmrc.ci .npmrc -Force

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all production surfaces
        run: pnpm build

      - name: Pack, install and smoke the CLI artifact
        run: pnpm smoke:cli:artifact

      - name: Package Windows installer
        run: pnpm --filter @nlc/desktop exec electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke packaged Desktop runtime
        run: pnpm smoke:desktop:runtime

      - name: Smoke silent install and uninstall
        run: pnpm smoke:windows:installer

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: coding-agent-windows-pr
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 7

  dependency-security:
    name: Dependency review and production audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
