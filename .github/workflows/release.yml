name: Build Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A tagged push creates a Release; manual runs only upload a verified artifact.
permissions:
  contents: write

jobs:
  build-windows:
    name: Verify and package Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Use hoisted node-linker for build
        shell: pwsh
        run: Copy-Item .npmrc.ci .npmrc -Force

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Deterministic default gates
        run: pnpm test
        env:
          # GitHub-hosted Windows runs as a non-interactive service session.
          # Native PTY behavior remains mandatory on interactive Windows.
          NLC_SKIP_NATIVE_PTY: "1"

      - name: Storage ABI and integration gates
        run: pnpm test:integration

      - name: Build all production surfaces
        run: pnpm build

      - name: Pack, install and smoke the CLI artifact
        run: pnpm smoke:cli:artifact

      - name: Package Windows installer
        run: pnpm --filter @nlc/desktop exec electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke packaged Desktop runtime
        run: pnpm smoke:desktop:runtime

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            Get-ChildItem release -File |
              Where-Object { $_.Extension -in '.exe', '.zip' }
          )
          if ($artifacts.Count -eq 0) {
            throw 'electron-builder produced no Windows installer or archive'
          }
          $artifacts | Select-Object FullName, Length

      - name: Smoke silent install and uninstall
        run: pnpm smoke:windows:installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: coding-agent-windows-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
